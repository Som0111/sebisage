<script>
const DATA = [{"id": "q001", "question": "What is the definition of a 'material subsidiary' under the LODR Regulations?", "gold_reg": "lodr_2015:24", "gold_sub_reg": "1", "difficulty": "easy", "type": "definition", "paraphrased": false, "chunk_id": "lodr_2015.pdf:24:1:0", "chunk_text": "At least one independent director on the board of directors of the listed entity shall \nbe a director on the board of directors of an unlisted material subsidiary, whether \nincorporated in India or not. \nExplanation - For the purposes of this provision, notwithstanding anything to the \ncontrary contained in regulation 16, the term “material subsidiary” shall mean a \nsubsidiary, whose turnover or net worth exceeds twenty percent of the consolidated \nturnover or net worth respectively, of the listed entity and its subsidiaries in the \nimmediately preceding accounting year."}, {"id": "q002", "question": "Who must a listed entity appoint as its compliance officer?", "gold_reg": "lodr_2015:6", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:6:1:0", "chunk_text": "A listed entity shall appoint a qualified company secretary as the compliance officer: \n \n \nProvided that the Compliance Officer shall be an officer, who is in whole time \nemployment of the listed entity, not more than one level below the board of directors and shall \nbe designated as a Key Managerial Personnel. \n \n(1A) Any vacancy in the office of the Compliance Officer shall be filled by the listed entity \nat the earliest and in any case not later than three months from the date of such vacancy: \n \nProvided that the listed entity shall not fill such vacancy by appointing a person in interim \ncapacity, unless such appointment is made in accordance with the laws applicable in case of a \nfresh appointment to such office and the obligations under such laws are made applicable to \nsuch person. \n \n(1B) Any vacancy in the office of the Compliance Officer of such listed entity in respect of \nwhich a resolution plan under section 31 of the Insolvency Code has been approved, shall be \nfilled within a period of three months of such approval: \n \n \nProvided that, in the interim, such listed entity shall have not less than one full-time key \nmanagerial personnel managing its day-to-day affairs."}, {"id": "q003", "question": "Within how many days must a listed entity redress an investor grievance?", "gold_reg": "lodr_2015:13", "gold_sub_reg": "1-2", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "lodr_2015.pdf:13:1-2:0", "chunk_text": "The listed entity shall redress investor grievances promptly but not later than \ntwenty-one calendar days from the date of receipt of the grievance and in such manner \nas may be specified by the Board.\n\nThe listed entity shall ensure that it is registered on the SCORES platform or such other \nelectronic platform or system of the Board as shall be mandated from time to time, in order \nto handle investor complaints electronically in the manner specified by the Board.\n\nProvided that in case of securitised debt instrument, SCORES registration may be taken at \nTrustee level for all special purpose distinct entities, they are trustee of."}, {"id": "q004", "question": "What minimum board composition requirements apply to a listed entity regarding women directors and non-executive directors?", "gold_reg": "lodr_2015:17", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:17:1:1", "chunk_text": "[Regulation 17] (a) board of directors shall have an optimum combination of executive and non-\nexecutive directors with at least one woman director and not less than fifty per \ncent. of the board of directors shall comprise of non-executive directors; \n \n134[Provided that the Board of directors of the  top 1000 listed entities \nshall have at least one independent woman director ;"}, {"id": "q005", "question": "How often must the board of directors of a listed entity meet, and what is the maximum gap allowed between two meetings?", "gold_reg": "lodr_2015:17", "gold_sub_reg": "2", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "lodr_2015.pdf:17:2:0", "chunk_text": "The board of directors shall meet at least four times a financial year, with a \nmaximum time gap of one hundred and twenty days between any two  consecutive \nmeetings.  \n \n159[(2A) The quorum for every meeting of the board of directors of the  top 2000 \nlisted entities  shall be one-third of its total strength or three directors, whichever \nis higher, including at least one independent director.  \n \nExplanation – For removal of doubts, it is clarified that the participation of the \ndirectors by video conferencing or by other audio-visual means shall also be counted \nfor the purposes of such quorum."}, {"id": "q006", "question": "What is the minimum size and independence requirement for the audit committee of a listed entity?", "gold_reg": "lodr_2015:18", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:18:1:0", "chunk_text": "Every listed entity shall constitute a qualified and independent audit committee in \naccordance with the terms of reference, subject to the following: \n(a) The audit committee shall have minimum three directors as members.  \n(b) At least two-thirds of the members of audit committee shall be independent \ndirectors and in case of a listed entity having outstanding SR equity shares, the \naudit committee shall only comprise of independent directors. \n(c) All members of audit committee shall be financially literate and at least one member \nshall have accounting or related financial management expertise. \n \nExplanation (1).- For the purpose of this regulation, “financially literate” shall mean \nthe ability to read and understand basic financial statements i.e. balance sheet, profit \nand loss account, and statement of cash flows. \n \nExplanation (2).- For the purpose of this regulation , a member shall be considered \nto have accounting or related financial management expertise if he or she possesses \nexperience in finance or accounting, or requisite professional certification in \naccounting, or any other comparable experience or background which results in the \nindividual’s financial sophistication, including being or having been a chief \n                                                          \n171 The paragraph appearing at the end of regulation 17A converted to an Explanation by the SEBI (Listing \nObligations and Disclosure Requirements) (Second Amendment) Regulations, 2021 w.e.f. 5.5.2021. \n172 Numbered as Explanation (1) by the Securities and Exchange Board of India (Listing Obligations and \nDisclosure Requirements) (Amendment) Regulations, 2025 w.e.f 28.03.2025.\n\nexecutive officer, chief financial officer or other senior officer with financial \noversight responsibilities. \n \n(d) The chairperson of the audit committee shall be an independent director and he \n/she shall be present at Annual general meeting to answer shareholder queries. \n(e) The Company Secretary shall act as the secretary to the audit committee. \n(f) The audit committee at its discretion shall invite the finance director or head of the \nfinance function, head of internal audit and a representative of the statutory auditor \nand any other such executives to be present at the meetings of the committee: \nProvided that occasionally the audit committee may meet without the presence of \nany executives of the listed entity."}, {"id": "q007", "question": "How much advance notice must a listed entity give the stock exchange before a board meeting considering financial results?", "gold_reg": "lodr_2015:29", "gold_sub_reg": "1-2", "difficulty": "medium", "type": "deadline", "paraphrased": false, "chunk_id": "lodr_2015.pdf:29:1-2:0", "chunk_text": "The listed entity shall give prior intimation of at least two working days in \nadvance, excluding the date of the intimation and date of the meeting, to stock exchange \nabout the meeting of the board of directors in which any of the following proposals is \ndue to be considered:  \n \n(a) financial results viz. quarterly, half yearly, or annual, as the case may be; \n \n(b) proposal for buyback of securities; \n \n(c) proposal for voluntary delisting by the listed entity from the stock exchange(s); \n \n(d) fund raising by way of issue of securities (excluding security receipts, \nsecuritized debt instruments or money market instruments regulated by the Reserve \nBank of India), through  further public offer, rights issue, American Depository \nReceipts/Global Depository Receipts/Foreign Currency Convertible Bonds, \nqualified institutions placement, debt issue, preferential issue or any other method \nand for determination of issue price: \n \n Provided that intimation shall also be given in case of any annual general  meeting \nor extraordinary general meeting or postal ballot that is proposed to be held for \nobtaining shareholder approval for further fund raising indicating type of issuance.  \n \nProvided further that intimation for determination of issue price in a qualified \ninstitutions placement is not required if such placement is done in accordance with the \nprovisions of the Securities and Exchange Board of India (Issue of Capital and \nDisclosure Requirements) Regulations, 2018. \n \n(e) declaration/ recommendation of dividend, issue of convertible securities including \nconvertible debentures or of debentures carrying a right to subscribe to equity \nshares or the passing over of dividend.  \n \n(f) the proposal for declaration of bonus securities: \n \n(g) any alteration in the form or nature of any of its securities that are listed on the stock \nexchange or in the rights or privileges of the holders thereof; \n \n(h) any alteration in the date on which, the interest on debentures or bonds, or the \nredemption amount of redeemable shares or of debentures or bonds, shall be payable.\n\nThe intimation required under sub-regulation (1) shall mention the date of such \nmeeting of board of directors. \n \n \n \nDisclosure of events or information."}, {"id": "q008", "question": "When must a listed entity submit its shareholding pattern statement to the stock exchange?", "gold_reg": "lodr_2015:31", "gold_sub_reg": "1", "difficulty": "medium", "type": "deadline", "paraphrased": false, "chunk_id": "lodr_2015.pdf:31:1:0", "chunk_text": "The listed entity shall submit to the stock exchange(s) a statement showing holding \nof securities and shareholding pattern separately for each class of securities, in the \nformat specified by the Board from time to time within the following timelines -  \n(a) one day prior to listing of its securities on the stock exchange(s); \n(b) on a quarterly basis, within twenty one days from the end of each quarter; and,  \n(c) within ten days of any capital restructuring of the listed entity resulting in a change \nexceeding two per cent of the total paid-up share capital:  \nProvided that in case of listed entities which have listed their specified securities on SME \nExchange, the above statements shall be submitted on a half yearly basis within twenty \none days from the end of each half year."}, {"id": "q009", "question": "What actions can a stock exchange take against a listed entity that contravenes the LODR Regulations?", "gold_reg": "lodr_2015:98", "gold_sub_reg": "1", "difficulty": "medium", "type": "penalty", "paraphrased": false, "chunk_id": "lodr_2015.pdf:98:1:0", "chunk_text": "The listed entity or any other person thereof who contravenes any of the provisions \nof these regulations, shall, in addition to liability for action in terms of the securities \nlaws, be liable for the following actions by the respective stock exchange(s), in the \nmanner specified in circulars or guidelines issued by the Board:  \n(a) imposition of fines; \n(b) suspension of trading; \n(c) freezing of promoter/promoter group holding of designated securities, as may be \napplicable, in coordination with depositories.  \n(d) any other action as may be specified by the Board from time to time \n(2)The manner of revocation of actions specified in clauses (b) and (c) of sub-regulation (1), \nshall be as specified in circulars or guidelines issued by the Board.  \n \nFailure to pay fine."}, {"id": "q010", "question": "What happens if a listed entity fails to pay a fine imposed on it by the stock exchange?", "gold_reg": "lodr_2015:99", "gold_sub_reg": null, "difficulty": "hard", "type": "penalty", "paraphrased": false, "chunk_id": "lodr_2015.pdf:99:None:0", "chunk_text": "If listed entity fails to pay any fine imposed on it within such period as specified from \ntime to time, by the recognised stock exchange(s), after a notice in writing has been \nserved on it, the stock exchange may initiate action.\n\nCHAPTER XI-A \nPOWER TO RELAX STRICT ENFORCEMENT OF THE REGULATIONS \nExemption from enforcement of the regulations in special cases."}, {"id": "q011", "question": "On what basis must a listed entity declare and disclose dividends?", "gold_reg": "lodr_2015:43", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:43:1:0", "chunk_text": "The listed entity shall declare and disclose the dividend on per share basis only. \n \n                                                          \n“The listed entity shall intimate the record date to all the stock exchange(s) where it is listed for the following \npurposes:” \n\n\n\n\n\n\n\n\n \nProvided that the listed entity shall ensure that there is a time gap of atleast thirty days between two \ndates of closure of its transfer books.”"}, {"id": "q012", "question": "Which events require a listed entity to intimate a record date to the stock exchange?", "gold_reg": "lodr_2015:42", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:42:1:0", "chunk_text": "The listed entity shall intimate the record date for the following events to all the \nstock exchange(s) where it is listed or where stock derivatives are available on the stock\n\nof the listed entity or where listed entity’s stock form part of an index on which \nderivatives are available: \n(a) declaration of dividend; \n(b) issue of right or bonus shares; \n(c) issue of shares for conversion of debentures or any other convertible security; \n(d) shares arising out of rights attached to debentures or any other convertible security \n(e) corporate actions like mergers, de-mergers, splits, etc; \n(f) such other purposes as may be specified by the stock exchange(s)."}, {"id": "q013", "question": "When must a listed company disclose a material event or information to the stock exchange?", "gold_reg": "lodr_2015:30", "gold_sub_reg": "1-2", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "lodr_2015.pdf:30:1-2:0", "chunk_text": "Every listed entity shall make disclosures of any events or information which, \nin the opinion of the board of directors of the listed company, is material.\n\nEvents specified in Para A of Part A of Schedule III are deemed to be material \nevents and listed entity shall make disclosure of such events."}, {"id": "q014", "question": "What board composition applies to a listed entity that has outstanding superior rights (SR) equity shares?", "gold_reg": "lodr_2015:17", "gold_sub_reg": "1", "difficulty": "hard", "type": "obligation", "paraphrased": false, "chunk_id": "lodr_2015.pdf:17:1:5", "chunk_text": "[Regulation 17] (d) where the listed company has outstanding SR equity shares, atleast half of the \nboard of directors shall comprise of independent directors. \n \n(1A) No listed entity shall appoint a person or continue the directorship of any \nperson as a non-executive director who has attained the age of seventy five years \nunless a special resolution is passed to that effect, in which case the explanatory \nstatement annexed to the notice for such motion shall indicate the justification for \nappointing such a person: \n \n \nProvided that the listed entity shall ensure compliance with this sub-\nregulation at the time of appointment or re-appointment or any time prior to the non-\nexecutive director attaining the age of seventy- five years.\n\n(1C). (a) The listed entity shall ensure that approval of shareholders for \nappointment or reappointment of a person on the board of directors or as a manager is \ntaken at the next general meeting or within a time period of three months from the date \nof appointment, whichever is earlier: \n \nProvided that if such appointment or re-appointment of a person to the board of \ndirectors or as a manager is subject to approval of regulatory, government or statutory \nauthorities, then the time taken to receive such approvals shall be excluded for the \npurposes of this clause: \n \nProvided further that a public sector company shall ensure that the approval of the \nshareholders for appointment or re-appointment of a person on the board of directors \nor as a Manager is taken at the next general meeting: \n \nProvided further that the requirements specified in this clause shall not be applicable \nto appointment or re-appointment of a person nominated by a financial sector \nregulator, Court or Tribunal to the board of the listed entity."}, {"id": "q015", "question": "What is a 'connected person' under the PIT Regulations?", "gold_reg": "pit_2015:2", "gold_sub_reg": "1", "difficulty": "medium", "type": "definition", "paraphrased": false, "chunk_id": "pit_2015.pdf:2:1:4", "chunk_text": "[Regulation 2] (d) \"connected person\" means,-"}, {"id": "q016", "question": "How do the PIT Regulations define an 'insider'?", "gold_reg": "pit_2015:2", "gold_sub_reg": "1", "difficulty": "easy", "type": "definition", "paraphrased": false, "chunk_id": "pit_2015.pdf:2:1:10", "chunk_text": "[Regulation 2] (g) \n\"insider\" means any person who is: \n \ni)  \na connected person; or  \n \nii)  \nin possession of or having access to unpublished price sensitive \ninformation;  \n \nNOTE:    Since \"generally available information\" is defined, it is intended that anyone \nin possession of or having access to unpublished price sensitive information should be \nconsidered as an \"insider\" regardless of the manner in which one came into possession \nof or had access to such information. Various circumstances are provided to enable such \na person to demonstrate that he has not indulged in insider trading. Therefore, this \ndefinition is intended to bring within its reach any person who is in receipt of or has \naccess to unpublished price sensitive information. The onus of showing that a certain \nperson was in possession of or had access to unpublished price sensitive information at \nthe time of trading would, therefore, be on the person leveling the charge after which the \nperson who has traded when in possession of or having access to unpublished price \nsensitive information may demonstrate that he was not in such possession or that he has \nnot traded or he could not access or that his trading when in possession of such \ninformation was squarely covered by the exonerating circumstances.”"}, {"id": "q017", "question": "What is 'unpublished price sensitive information' under the PIT Regulations?", "gold_reg": "pit_2015:2", "gold_sub_reg": "1", "difficulty": "easy", "type": "definition", "paraphrased": false, "chunk_id": "pit_2015.pdf:2:1:28", "chunk_text": "[Regulation 2] (n) \n\"unpublished price sensitive information\" means any information, relating to a \ncompany or its securities, directly or indirectly, that is not generally available which upon \nbecoming generally available, is likely to materially affect the price of the securities and \nshall, ordinarily including but not restricted to, information relating to the following: –"}, {"id": "q018", "question": "Can an insider communicate unpublished price sensitive information to another person?", "gold_reg": "pit_2015:3", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:3:1:0", "chunk_text": "No insider shall communicate, provide, or allow access to any unpublished price \nsensitive information, relating to a company or securities listed or proposed to be listed, to any \nperson including other insiders except where such communication is in furtherance of legitimate \npurposes, performance of duties or discharge of legal obligations.  \n \nNOTE: \nThis provision is intended to cast an obligation on all insiders who are essentially \npersons in possession of unpublished price sensitive information to handle such information with \ncare and to deal with the information with them when transacting their business strictly on a \nneed-to-know basis.  It is also intended to lead to organisations developing practices based on \nneed-to-know principles for treatment of information in their possession."}, {"id": "q019", "question": "Within how many days must a newly appointed key managerial personnel disclose their securities holdings?", "gold_reg": "pit_2015:7", "gold_sub_reg": "1", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "pit_2015.pdf:7:1:0", "chunk_text": "Initial Disclosures.  \n(a). \n \n \n(b). \nEvery person on appointment as a key managerial personnel or a director of the \ncompany or upon becoming a promoter or member of the promoter group shall \ndisclose his holding of securities of the company as on the date of appointment or \nbecoming a promoter, to the company within seven days of such appointment or \nbecoming a promoter."}, {"id": "q020", "question": "Who is responsible for formulating the code of conduct to regulate trading by designated persons?", "gold_reg": "pit_2015:9", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:9:1:0", "chunk_text": "The board of directors of every listed company and the board of directors or \nhead(s) of the organisation of every intermediary shall ensure that the chief executive officer or \nmanaging director shall formulate a code of conduct with their approval to regulate, monitor \nand report trading by its designated persons and immediate relatives of designated persons \ntowards achieving compliance with these regulations, adopting the minimum standards set out in \nSchedule B (in case of a listed company) and Schedule C (in case of an intermediary) to these \nregulations, without diluting the provisions of these regulations in any manner. \n \nExplanation – For the avoidance of doubt it is clarified that intermediaries, which are listed, \nwould be required to formulate a code of conduct to regulate, monitor and report trading by their \ndesignated persons, by adopting the minimum standards set out in Schedule B with respect to \ntrading in their own securities and in Schedule C with respect to trading in other securities. \n \nNOTE: \nIt is intended that every company whose securities are listed on stock exchanges \nand every intermediary registered with SEBI is mandatorily required to formulate a code of \nconduct governing trading by designated persons and their immediate relatives.  The \nstandards set out in the schedules are required to be addressed by such code of conduct."}, {"id": "q021", "question": "What must a listed company do if it observes a violation of the code of conduct formulated under regulation 9?", "gold_reg": "pit_2015:13", "gold_sub_reg": null, "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:13:None:0", "chunk_text": "The code of conduct shall specify that in case it is observed by the listed company \nrequired to formulate a code of conduct under sub-regulation (1) of regulation 9, that \nthere has been a violation of these regulations, it shall promptly inform the stock \nexchange(s) where the concerned securities are traded, in such form and such manner as may be \nspecified by the Board from time to time.  \n \n119[14.  Designated persons shall be required to disclose names and Permanent Account Number \nor any other identifier authorized by law of the following persons to the company on an annual \nbasis and as and when the information changes: \n \na) \nimmediate relatives \nb) \npersons with whom such designated person(s) shares a material financial \nrelationship \nc) \nPhone, mobile and cell numbers which are used by them \n \nIn addition, the names of educational institutions from which designated persons have graduated \nand names of their past employers shall also be disclosed on a one time basis. \n \nExplanation – The term “material financial relationship” shall mean a relationship in which one \nperson is a recipient of any kind of payment such as by way of a loan or gift from a\n\ndesignated person during the immediately preceding twelve months, equivalent to at least 25% \nof the annual income of such designated person but shall exclude relationships in which the \npayment is based on arm’s length transactions.]"}, {"id": "q022", "question": "Is an insider generally allowed to trade in securities while in possession of unpublished price sensitive information?", "gold_reg": "pit_2015:4", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:4:1:0", "chunk_text": "[Regulation 4] No insider shall trade in securities that are listed or proposed to be listed on a \nstock exchange when in possession of unpublished price sensitive information: \n \n                                                                                                                                                                                           \n“The board of directors shall ensure that a structured digital database is maintained containing the names of such \npersons or entities as the case may be with whom information is shared under this regulation along with the \nPermanent Account Number or any other identifier authorized by law where Permanent Account Number is not \navailable. Such databases shall be maintained with adequate internal controls and checks such as time stamping and \naudit trails to ensure non-tampering of the database.” \nEarlier, sub-regulation 5 was inserted by Securities and Exchange Board of India (Prohibition of Insider Trading) \n(Amendment) Regulations, 2018 (w.e.f. April 01, 2019).\n\nExplanation –When a person who has traded in securities has been in possession of \nunpublished price sensitive information, his trades would be presumed to have been motivated \nby the knowledge and awareness of such information in his possession. \n \n \nProvided that the insider may prove his innocence by demonstrating the circumstances \nincluding the following: –"}, {"id": "q023", "question": "What is the minimum cooling-off period before trading can begin under a pre-approved trading plan?", "gold_reg": "pit_2015:5", "gold_sub_reg": "2", "difficulty": "medium", "type": "threshold", "paraphrased": false, "chunk_id": "pit_2015.pdf:5:2:1", "chunk_text": "[Regulation 5] (i) \nnot entail commencement of trading on behalf of the insider earlier than one \nhundred and twenty calendar days from the public disclosure of the plan;\n\nNOTE: \nIt is intended that to get the benefit of a trading plan, a cool-off period of \none hundred and twenty calendar days is necessary. Companies declare their \nresults quarterly and there exists a trading restriction, in terms of these Regulations, \nfrom quarter end to two days after declaration of quarterly result, which, it is seen, is \ngenerally a period of around one month for most companies. Thus, one hundred and \ntwenty calendar days period is considered reasonably long for unpublished price \nsensitive information that is in possession of the insider when formulating the trading \nplan, to become generally available.  It is also considered to be a reasonable period for a \ntime lag in which new unpublished price sensitive information may come into being \nwithout adversely affecting the trading plan formulated earlier. In any case, it should be \nremembered that this is only a statutory cool-off period and would not grant immunity \nfrom action if the insider were to be in possession of the same unpublished price sensitive \ninformation both at the time of formulation of the plan and implementation of the same."}, {"id": "q024", "question": "What was repealed by the PIT Regulations, 2015?", "gold_reg": "pit_2015:12", "gold_sub_reg": "1-2", "difficulty": "hard", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:12:1-2:0", "chunk_text": "The Securities and Exchange Board of India (Prohibition of Insider Trading) \nRegulations, 1992 are hereby repealed.\n\nNotwithstanding such repeal,—\n\n(a)  \nthe previous operation of the repealed regulations or anything duly done or suffered \nthereunder, any right, privilege, obligation or liability acquired, accrued or incurred under the \nrepealed regulations, any penalty, forfeiture or punishment incurred in respect of any offence \ncommitted against the repealed regulations, or any investigation, legal proceeding or remedy in \nrespect of any such right, privilege, obligation, liability, penalty, forfeiture or punishment as \naforesaid, shall remain unaffected as if the repealed regulations had never been repealed; and  \n \n(b) \nanything done or any action taken or purported to have been done or taken including any \nadjudication, enquiry or investigation commenced or show-cause notice issued under the \nrepealed regulations prior to such repeal, shall be deemed to have been done or taken under the \ncorresponding provisions of these regulations;"}, {"id": "q025", "question": "Who may formulate a trading plan and who must approve it?", "gold_reg": "pit_2015:5", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "pit_2015.pdf:5:1:0", "chunk_text": "An insider shall be entitled to formulate a trading plan and present it to the \ncompliance officer for approval and public disclosure pursuant to which trades may be carried \nout on his behalf in accordance with such plan.  \n \nNOTE: \nThis provision intends to give an option to persons who may be perpetually in \npossession of unpublished price sensitive information and enabling them to trade in securities in \na compliant manner.  This provision would enable the formulation of a trading plan by an \ninsider to enable him to plan for trades to be executed in future.  By doing so, the possession of \nunpublished price sensitive information when a trade under a trading plan is actually executed \nwould not prohibit the execution of such trades that he had pre-decided even before the \nunpublished price sensitive information came into being."}, {"id": "q026", "question": "At what shareholding or voting rights threshold does an acquirer trigger the obligation to make an open offer?", "gold_reg": "sast_2011:3", "gold_sub_reg": "1", "difficulty": "easy", "type": "threshold", "paraphrased": false, "chunk_id": "sast_2011.pdf:3:1:0", "chunk_text": "No acquirer shall acquire shares or voting rights in a target company which \ntaken together with shares or voting rights, if any, held by him and by persons \nacting in concert with him in such target company, entitle them to exercise \ntwenty-five per cent or more of the voting rights in such target company unless \nthe acquirer makes a public announcement of an open offer for acquiring shares \nof such target company in accordance with these regulations."}, {"id": "q027", "question": "How much can an acquirer already holding between 25% and the maximum permissible non-public shareholding acquire in a financial year without triggering an open offer?", "gold_reg": "sast_2011:3", "gold_sub_reg": "2", "difficulty": "hard", "type": "threshold", "paraphrased": false, "chunk_id": "sast_2011.pdf:3:2:0", "chunk_text": "No acquirer, who together with persons acting in concert with him, has \nacquired and holds in accordance with these regulations shares or voting rights \nin a target company entitling them to exercise twenty-five per cent or more of \nthe voting rights in the target company but less than the maximum permissible \nnon-public shareholding, shall acquire within any financial year additional\n\nshares or voting rights in such target company entitling them to exercise more \nthan five per cent of the voting rights, unless the acquirer makes a public \nannouncement of an open offer for acquiring shares of such target company in \naccordance with these regulations: \n  \nProvided that the acquisition beyond five per cent but upto ten per cent \nof the voting rights in the target company shall be permitted for the financial \nyear 2020-21 only in respect of acquisition by a promoter pursuant to \npreferential issue of equity shares by the target company. \n  \nProvided that such acquirer shall not be entitled to acquire or enter into \nany agreement to acquire shares or voting rights exceeding such number of \nshares as would take the aggregate shareholding pursuant to the acquisition \nabove the maximum permissible non-public shareholding. \n \nProvided further that, acquisition pursuant to a resolution plan approved \nunder section 31 of the Insolvency and Bankruptcy Code, No. 31 of \n2016 shall be exempt from the obligation under the proviso to the sub-\nregulation (2) of regulation 3. \n \nExplanation.— For purposes of determining the quantum of acquisition of \nadditional voting rights under this sub-regulation,— \n \n(i) gross acquisitions alone shall be taken into account regardless of any \nintermittent fall in shareholding or voting rights whether owing to \ndisposal of shares held or dilution of voting rights owing to fresh issue \nof shares by the target company. \n \n(ii) in the case of acquisition of shares by way of issue of new shares by the \ntarget company or where the target company has made an issue of new \nshares in any given financial year, the difference between the pre-\nallotment and the post-allotment percentage voting rights shall be \nregarded as the quantum of additional acquisition ."}, {"id": "q028", "question": "What is the minimum size of an open offer that must be made under regulations 3 and 4 of the SAST Regulations?", "gold_reg": "sast_2011:7", "gold_sub_reg": "1", "difficulty": "medium", "type": "threshold", "paraphrased": false, "chunk_id": "sast_2011.pdf:7:1:0", "chunk_text": "The open offer for acquiring shares to be made by the acquirer and persons \nacting in concert with him under regulation 3 and regulation 4 shall be for at \nleast twenty six per cent  of total shares of the target company, as of tenth \nworking day from the closure of the tendering period: \n \n \n  \n \nProvided that the total shares of the target company as of tenth \nworking day from the closure of the tendering period shall take into account \nall potential increases in the number of outstanding shares during the offer \nperiod contemplated as of the date of the public announcement: \n \n \n  \n \nProvided further that the offer size shall be proportionately \nincreased in case of an increase in total number of shares, after the public \nannouncement, which is not contemplated on the date of the public \nannouncement."}, {"id": "q029", "question": "When must the public announcement of an open offer be made?", "gold_reg": "sast_2011:13", "gold_sub_reg": "1", "difficulty": "medium", "type": "deadline", "paraphrased": false, "chunk_id": "sast_2011.pdf:13:1:0", "chunk_text": "The public announcement referred to in regulation 3 and regulation 4 shall be \nmade in accordance with regulation 14 and regulation 15, on the date of \nagreeing to acquire shares or voting rights in, or control over the target \ncompany."}, {"id": "q030", "question": "Can a wilful defaulter make a public announcement of an open offer?", "gold_reg": "sast_2011:6A", "gold_sub_reg": null, "difficulty": "hard", "type": "obligation", "paraphrased": false, "chunk_id": "sast_2011.pdf:6A:None:0", "chunk_text": "Notwithstanding anything contained in these regulations, no person who is a wilful \ndefaulter shall make a public announcement of an open offer for acquiring shares or enter \ninto any transaction that would attract the obligation to make a public announcement of \nan open offer for acquiring shares under these regulations: \n \nProvided that this regulation shall not prohibit the wilful defaulter from making a \ncompeting offer in accordance with regulation 20 of these regulations upon any other \nperson making an open offer for acquiring shares of the target company."}, {"id": "q031", "question": "What must an acquirer do simultaneously with filing the draft letter of offer with the Board?", "gold_reg": "sast_2011:18", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "sast_2011.pdf:18:1:0", "chunk_text": "Simultaneously with the filing of the draft letter of offer with the Board under \nsub-regulation (1) of regulation 16, the acquirer shall send a copy of the draft \nletter of offer to the target company at its registered office address and to all \nstock exchanges where the shares of the target company are listed."}, {"id": "q032", "question": "How is 'volume weighted average price' defined under the SAST Regulations?", "gold_reg": "sast_2011:2", "gold_sub_reg": "2", "difficulty": "easy", "type": "definition", "paraphrased": false, "chunk_id": "sast_2011.pdf:2:2:28", "chunk_text": "[Regulation 2] (zc)  “volume weighted average price” means the product of the number of \nequity shares bought and price of each such equity share divided by the \ntotal number of equity shares bought;"}, {"id": "q033", "question": "What must an acquirer do if there is a shortfall in the escrow account maintained for an open offer?", "gold_reg": "sast_2011:17", "gold_sub_reg": "7", "difficulty": "hard", "type": "obligation", "paraphrased": false, "chunk_id": "sast_2011.pdf:17:7:0", "chunk_text": "For such part of the escrow account as is in the form of securities, the acquirer shall \nempower the manager to the open offer to realise the value of such escrow account \nby sale or otherwise, and in the event there is any shortfall in the amount required \nto be maintained in the escrow account, the manager to the open offer shall be liable \nto make good such shortfall."}, {"id": "q034", "question": "What must a person obtain before acting as an investment adviser?", "gold_reg": "ia_2013:3", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "ia_2013.pdf:3:1:0", "chunk_text": "On and from the commencement of these regulations, no person shall act as an \ninvestment adviser or hold itself out as an investment adviser unless he has obtained a \ncertificate of registration from the Board under these regulations: \n \n(1A) Notwithstanding anything contained in sub-regulation (1), any application made \nby a person prior to coming into force of these regulations containing such particulars \nor as near thereto as mentioned in Form A of First Schedule shall be treated as an \napplication made in pursuance of sub-regulation (1) and dealt with accordingly;"}, {"id": "q035", "question": "What duty does an investment adviser owe to its clients regarding conflicts of interest?", "gold_reg": "ia_2013:15", "gold_sub_reg": "1-2", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "ia_2013.pdf:15:1-2:0", "chunk_text": "An investment adviser shall act in a fiduciary capacity towards its clients and \nshall disclose all conflicts of interests as and when they arise.\n\nAn investment adviser shall not receive any consideration by way of \nremuneration or compensation or in any other form from any person other than the \nclient being advised, in respect of the underlying products or securities for which advice \nis provided."}, {"id": "q036", "question": "For how long must an investment adviser preserve its records?", "gold_reg": "ia_2013:19", "gold_sub_reg": "2", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "ia_2013.pdf:19:2:0", "chunk_text": "All records shall be maintained either in physical or electronic form and preserved \nfor a minimum period of five years: \nProvided that where records are required to be duly signed and are maintained in \nelectronic form, such records shall be digitally signed."}, {"id": "q037", "question": "What records must an investment adviser maintain about its clients?", "gold_reg": "ia_2013:19", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ia_2013.pdf:19:1:0", "chunk_text": "An investment adviser shall maintain the following records,- \n(a) Know Your Client records of the client; \n(b) Risk profiling and risk assessment of the client; \n(c) Suitability assessment of the advice being provided; \n(d) Copies of agreements with clients, incorporating the terms and conditions as \nmay be specified by the Board; \n(e) Investment advice provided, whether written or oral; \n(f) Rationale for arriving at investment advice, duly signed and dated; \n(g) A register or record containing list of the clients along with PAN, the date \nof advice, nature of the advice, the details of products/securities in which\n\nadvice was rendered and fee/consideration, if any charged/received for such \nadvice;  \n(h) Records of communication including emails, call recordings etc. with all \nclients including prospective clients, as may be specified."}, {"id": "q038", "question": "Can an individual investment adviser provide distribution services?", "gold_reg": "ia_2013:22", "gold_sub_reg": "1-2", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ia_2013.pdf:22:1-2:0", "chunk_text": "An individual investment adviser shall not provide distribution services.\n\nThe family of an individual investment adviser shall not provide distribution \nservices to the client advised by the individual investment adviser and no individual \ninvestment adviser shall provide advice to a client who is receiving distribution services \nfrom other family members."}, {"id": "q039", "question": "How often must an investment adviser conduct a compliance audit, and who can perform it?", "gold_reg": "ia_2013:19", "gold_sub_reg": "3", "difficulty": "medium", "type": "deadline", "paraphrased": false, "chunk_id": "ia_2013.pdf:19:3:0", "chunk_text": "An investment adviser shall conduct yearly audit in respect of compliance with these \nregulations from a member of Institute of Chartered Accountants of India or Institute of \nCompany Secretaries of India or Institute of Cost Accountants of India and submit \na report of the same as may be specified by the Board. \n \nWebsite."}, {"id": "q040", "question": "What must a person obtain before acting as a research analyst?", "gold_reg": "ra_2014:3", "gold_sub_reg": "1", "difficulty": "easy", "type": "obligation", "paraphrased": false, "chunk_id": "ra_2014.pdf:3:1:0", "chunk_text": "On and from the commencement of these regulations, no person shall act as a      research \nanalyst or research entity or hold itself out as a research analyst unless he has obtained a \ncertificate of registration from the Board under these regulations: \nProvided that any person acting as research analyst or research entity before the commencement \nof these regulations may continue to do so for a period of six months from such commencement \nor, if it has made an application for a certificate of registration under sub-regulation (2) within \nthe said period of six months, till the disposal of such application: \nProvided further that an investment adviser, credit rating agency, asset management company or \nfund manager, who issues research report or circulates/distributes research report to public or its \ndirector or employee who makes public appearance, shall not be required to seek registration \nunder regulation 3, subject to compliance of Chapter III of these regulations: \nProvided further that any principal officer, person associated with research services and \npartner of a research analyst which is registered under these regulations shall not be required to \nseek registration under regulation 3, subject to compliance with regulation 7 of these \nregulations."}, {"id": "q041", "question": "For how long must a research analyst preserve its records?", "gold_reg": "ra_2014:25", "gold_sub_reg": "2", "difficulty": "easy", "type": "deadline", "paraphrased": false, "chunk_id": "ra_2014.pdf:25:2:0", "chunk_text": "All records shall be maintained either in physical or electronic form and preserved for a \nminimum period of five years: \nProvided that where records are required to be duly signed and are maintained in electronic form, \nsuch records shall be digitally signed."}, {"id": "q042", "question": "What records must a research analyst maintain?", "gold_reg": "ra_2014:25", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ra_2014.pdf:25:1:0", "chunk_text": "Research analyst or research entity shall maintain the following records: \n(i) research report duly signed and dated; \n(ii) research recommendation provided;\n\n(iii)rationale for arriving at research recommendation; \n(iv) record of public appearance. \n(v) Know Your Client records of the fee paying client;  \n(vi) a register or record containing list of the clients along with client’s PAN, the date \nand nature of the research service, details of the products/securities for which \nresearch service was provided and fee/consideration, if any charged/received for \nsuch research service;  \n(vii) records of communication including emails, call recordings etc. with all clients \nincluding prospective clients in such manner as may be specified;  \n(viii) the terms and conditions of research services disclosed to the clients and the \nconsent of the client thereon."}, {"id": "q043", "question": "What is required regarding the personal trading activities of individuals employed as research analysts?", "gold_reg": "ra_2014:16", "gold_sub_reg": "1-2", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ra_2014.pdf:16:1-2:0", "chunk_text": "Personal trading activities of the individuals employed as research analyst by research \nentity shall be monitored, recorded and wherever necessary, shall be subject to a formal approval \nprocess.\n\nIndependent research analysts, part-time research analysts, individuals employed as \nresearch analyst by research entity  or their associates shall not deal or trade in securities that the \nresearch analyst recommends or follows within thirty days before and five  days after the \npublication of a research report."}, {"id": "q044", "question": "Can a research analyst trade in a security contrary to their own published recommendation on it?", "gold_reg": "ra_2014:16", "gold_sub_reg": "3-4", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ra_2014.pdf:16:3-4:0", "chunk_text": "Independent research analysts, part-time research analysts, individuals employed as \nresearch analysts by research entity or their associates shall not deal or trade directly or indirectly \nin securities that he reviews in a manner contrary to his given recommendation.\n\nIndependent research analysts, part-time research analysts, individuals employed as \nresearch analysts by research entity or their associate shall not purchase or receive securities of\n\nthe issuer before the issuer's initial public offering, if the issuer is principally engaged in the \nsame types of business as companies that the research analyst follows or recommends."}, {"id": "q045", "question": "What must a research analyst ensure about the facts used in its research reports?", "gold_reg": "ra_2014:20", "gold_sub_reg": "1-2", "difficulty": "medium", "type": "obligation", "paraphrased": false, "chunk_id": "ra_2014.pdf:20:1-2:0", "chunk_text": "Research analyst or research entity shall take steps to ensure that facts in its research \nreports are based on reliable information and shall define the terms used in making \nrecommendations, and these terms shall be consistently used.\n\nResearch analyst or research entity that employs a rating system must clearly define the \nmeaning of each such rating including the time horizon and  benchmarks on which a rating is \nbased."}, {"id": "q046", "question": "If a company's board decides something big is happening, how soon do they have to tell the public?", "gold_reg": "lodr_2015:30", "gold_sub_reg": "1-2", "difficulty": "medium", "type": "deadline", "paraphrased": true, "chunk_id": "lodr_2015.pdf:30:1-2:0", "chunk_text": "Every listed entity shall make disclosures of any events or information which, \nin the opinion of the board of directors of the listed company, is material.\n\nEvents specified in Para A of Part A of Schedule III are deemed to be material \nevents and listed entity shall make disclosure of such events."}, {"id": "q047", "question": "Is someone who knows a juicy company secret before it's public allowed to tip off a friend?", "gold_reg": "pit_2015:3", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": true, "chunk_id": "pit_2015.pdf:3:1:0", "chunk_text": "No insider shall communicate, provide, or allow access to any unpublished price \nsensitive information, relating to a company or securities listed or proposed to be listed, to any \nperson including other insiders except where such communication is in furtherance of legitimate \npurposes, performance of duties or discharge of legal obligations.  \n \nNOTE: \nThis provision is intended to cast an obligation on all insiders who are essentially \npersons in possession of unpublished price sensitive information to handle such information with \ncare and to deal with the information with them when transacting their business strictly on a \nneed-to-know basis.  It is also intended to lead to organisations developing practices based on \nneed-to-know principles for treatment of information in their possession."}, {"id": "q048", "question": "How big a stake can someone buy in a company before they're forced to offer to buy out other shareholders?", "gold_reg": "sast_2011:3", "gold_sub_reg": "1", "difficulty": "medium", "type": "threshold", "paraphrased": true, "chunk_id": "sast_2011.pdf:3:1:0", "chunk_text": "No acquirer shall acquire shares or voting rights in a target company which \ntaken together with shares or voting rights, if any, held by him and by persons \nacting in concert with him in such target company, entitle them to exercise \ntwenty-five per cent or more of the voting rights in such target company unless \nthe acquirer makes a public announcement of an open offer for acquiring shares \nof such target company in accordance with these regulations."}, {"id": "q049", "question": "How long does a financial advisor have to hang on to their client paperwork?", "gold_reg": "ia_2013:19", "gold_sub_reg": "2", "difficulty": "easy", "type": "deadline", "paraphrased": true, "chunk_id": "ia_2013.pdf:19:2:0", "chunk_text": "All records shall be maintained either in physical or electronic form and preserved \nfor a minimum period of five years: \nProvided that where records are required to be duly signed and are maintained in \nelectronic form, such records shall be digitally signed."}, {"id": "q050", "question": "What's the least number of times a company's board needs to get together each year?", "gold_reg": "lodr_2015:17", "gold_sub_reg": "2", "difficulty": "medium", "type": "deadline", "paraphrased": true, "chunk_id": "lodr_2015.pdf:17:2:0", "chunk_text": "The board of directors shall meet at least four times a financial year, with a \nmaximum time gap of one hundred and twenty days between any two  consecutive \nmeetings.  \n \n159[(2A) The quorum for every meeting of the board of directors of the  top 2000 \nlisted entities  shall be one-third of its total strength or three directors, whichever \nis higher, including at least one independent director.  \n \nExplanation – For removal of doubts, it is clarified that the participation of the \ndirectors by video conferencing or by other audio-visual means shall also be counted \nfor the purposes of such quorum."}, {"id": "q051", "question": "Who's in charge of making sure a listed company follows the rules day to day?", "gold_reg": "lodr_2015:6", "gold_sub_reg": "1", "difficulty": "medium", "type": "obligation", "paraphrased": true, "chunk_id": "lodr_2015.pdf:6:1:0", "chunk_text": "A listed entity shall appoint a qualified company secretary as the compliance officer: \n \n \nProvided that the Compliance Officer shall be an officer, who is in whole time \nemployment of the listed entity, not more than one level below the board of directors and shall \nbe designated as a Key Managerial Personnel. \n \n(1A) Any vacancy in the office of the Compliance Officer shall be filled by the listed entity \nat the earliest and in any case not later than three months from the date of such vacancy: \n \nProvided that the listed entity shall not fill such vacancy by appointing a person in interim \ncapacity, unless such appointment is made in accordance with the laws applicable in case of a \nfresh appointment to such office and the obligations under such laws are made applicable to \nsuch person. \n \n(1B) Any vacancy in the office of the Compliance Officer of such listed entity in respect of \nwhich a resolution plan under section 31 of the Insolvency Code has been approved, shall be \nfilled within a period of three months of such approval: \n \n \nProvided that, in the interim, such listed entity shall have not less than one full-time key \nmanagerial personnel managing its day-to-day affairs."}, {"id": "q052", "question": "How fast does a company have to sort out a shareholder's complaint?", "gold_reg": "lodr_2015:13", "gold_sub_reg": "1-2", "difficulty": "easy", "type": "deadline", "paraphrased": true, "chunk_id": "lodr_2015.pdf:13:1-2:0", "chunk_text": "The listed entity shall redress investor grievances promptly but not later than \ntwenty-one calendar days from the date of receipt of the grievance and in such manner \nas may be specified by the Board.\n\nThe listed entity shall ensure that it is registered on the SCORES platform or such other \nelectronic platform or system of the Board as shall be mandated from time to time, in order \nto handle investor complaints electronically in the manner specified by the Board.\n\nProvided that in case of securitised debt instrument, SCORES registration may be taken at \nTrustee level for all special purpose distinct entities, they are trustee of."}, {"id": "q053", "question": "Is it okay for someone giving stock tips for a living to also earn commissions from selling the products they're recommending?", "gold_reg": "ia_2013:22", "gold_sub_reg": "1-2", "difficulty": "hard", "type": "obligation", "paraphrased": true, "chunk_id": "ia_2013.pdf:22:1-2:0", "chunk_text": "An individual investment adviser shall not provide distribution services.\n\nThe family of an individual investment adviser shall not provide distribution \nservices to the client advised by the individual investment adviser and no individual \ninvestment adviser shall provide advice to a client who is receiving distribution services \nfrom other family members."}, {"id": "q054", "question": "If a stock research writer publishes a 'buy' call, can they turn around and sell their own shares against it?", "gold_reg": "ra_2014:16", "gold_sub_reg": "3-4", "difficulty": "medium", "type": "obligation", "paraphrased": true, "chunk_id": "ra_2014.pdf:16:3-4:0", "chunk_text": "Independent research analysts, part-time research analysts, individuals employed as \nresearch analysts by research entity or their associates shall not deal or trade directly or indirectly \nin securities that he reviews in a manner contrary to his given recommendation.\n\nIndependent research analysts, part-time research analysts, individuals employed as \nresearch analysts by research entity or their associate shall not purchase or receive securities of\n\nthe issuer before the issuer's initial public offering, if the issuer is principally engaged in the \nsame types of business as companies that the research analyst follows or recommends."}, {"id": "q055", "question": "What's the smallest slice of a company's stock a buyer has to offer for, once they're required to make a buyout offer?", "gold_reg": "sast_2011:7", "gold_sub_reg": "1", "difficulty": "hard", "type": "threshold", "paraphrased": true, "chunk_id": "sast_2011.pdf:7:1:0", "chunk_text": "The open offer for acquiring shares to be made by the acquirer and persons \nacting in concert with him under regulation 3 and regulation 4 shall be for at \nleast twenty six per cent  of total shares of the target company, as of tenth \nworking day from the closure of the tendering period: \n \n \n  \n \nProvided that the total shares of the target company as of tenth \nworking day from the closure of the tendering period shall take into account \nall potential increases in the number of outstanding shares during the offer \nperiod contemplated as of the date of the public announcement: \n \n \n  \n \nProvided further that the offer size shall be proportionately \nincreased in case of an increase in total number of shares, after the public \nannouncement, which is not contemplated on the date of the public \nannouncement."}, {"id": "q056", "question": "What const STORAGE_KEY = "sebisage_review_v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();

function getRow(id) {
  return state[id] || { status: null, question: null, gold_reg: null, gold_sub_reg: null };
}

function setStatus(id, status) {
  const row = getRow(id);
  row.status = row.status === status ? null : status;
  state[id] = row;
  saveState(state);
  render();
}

function saveEdit(id) {
  const row = getRow(id);
  row.question = document.getElementById("edit-q-" + id).value;
  row.gold_reg = document.getElementById("edit-reg-" + id).value || null;
  row.gold_sub_reg = document.getElementById("edit-sub-" + id).value || null;
  state[id] = row;
  saveState(state);
}

function updateProgress() {
  const reviewed = DATA.filter(d => getRow(d.id).status).length;
  document.getElementById("progress").textContent = reviewed + " / " + DATA.length + " reviewed";
}

function render() {
  const container = document.getElementById("cards");
  container.innerHTML = "";
  for (const d of DATA) {
    const row = getRow(d.id);
    const card = document.createElement("div");
    card.className = "card" + (row.status ? " status-" + row.status : "");

    const badges = document.createElement("div");
    badges.className = "badges";
    badges.innerHTML = `<span>${d.id}</span><span>${d.type}</span><span>${d.difficulty}</span>` +
      (d.paraphrased ? `<span>paraphrased</span>` : "") +
      (d.gold_reg === null ? `<span>out-of-scope</span>` : "");
    card.appendChild(badges);

    const q = document.createElement("div");
    q.className = "question";
    q.textContent = row.question || d.question;
    card.appendChild(q);

    const meta = document.createElement("div");
    meta.className = "meta";
    const gr = row.gold_reg !== null ? row.gold_reg : d.gold_reg;
    const gs = row.gold_sub_reg !== null ? row.gold_sub_reg : d.gold_sub_reg;
    meta.textContent = "gold_reg: " + (gr || "null") + "   gold_sub_reg: " + (gs || "null") +
      "   chunk_id: " + (d.chunk_id || "null");
    card.appendChild(meta);

    if (d.chunk_text) {
      const chunk = document.createElement("div");
      chunk.className = "chunk";
      chunk.textContent = d.chunk_text;
      card.appendChild(chunk);
    }

    const editBox = document.createElement("div");
    editBox.className = "edit-box" + (row.status === "fix" ? " open" : "");
    editBox.innerHTML = `
      <textarea id="edit-q-${d.id}" rows="2" placeholder="Edited question">${row.question || d.question}</textarea>
      <input id="edit-reg-${d.id}" placeholder="gold_reg (e.g. lodr_2015:30)" value="${gr || ""}">
      <input id="edit-sub-${d.id}" placeholder="gold_sub_reg (e.g. 1-2)" value="${gs || ""}">
    `;
    card.appendChild(editBox);

    const actions = document.createElement("div");
    actions.className = "actions";
    const keepBtn = document.createElement("button");
    keepBtn.textContent = "Keep";
    keepBtn.className = row.status === "keep" ? "active-keep" : "";
    keepBtn.onclick = () => setStatus(d.id, "keep");
    const fixBtn = document.createElement("button");
    fixBtn.textContent = "Fix";
    fixBtn.className = row.status === "fix" ? "active-fix" : "";
    fixBtn.onclick = () => { saveEdit(d.id); setStatus(d.id, "fix"); };
    const dropBtn = document.createElement("button");
    dropBtn.textContent = "Drop";
    dropBtn.className = row.status === "drop" ? "active-drop" : "";
    dropBtn.onclick = () => setStatus(d.id, "drop");
    actions.append(keepBtn, fixBtn, dropBtn);
    card.appendChild(actions);

    editBox.querySelectorAll("textarea, input").forEach(el => {
      el.addEventListener("change", () => saveEdit(d.id));
    });

    container.appendChild(card);
  }
  updateProgress();
}

function exportVerified() {
  const lines = [];
  for (const d of DATA) {
    const row = getRow(d.id);
    if (row.status === "drop") continue;
    lines.push(JSON.stringify({
      id: d.id,
      question: row.question || d.question,
      gold_reg: row.gold_reg !== null ? (row.gold_reg || null) : d.gold_reg,
      gold_sub_reg: row.gold_sub_reg !== null ? (row.gold_sub_reg || null) : d.gold_sub_reg,
      difficulty: d.difficulty,
      type: d.type,
      paraphrased: d.paraphrased,
      chunk_id: d.chunk_id
    }));
  }
  const blob = new Blob([lines.join("\n") + "\n"], { type: "application/x-ndjson" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questions_verified.jsonl";
  a.click();
}

render();
</script>
